name: Keep Supabase Alive

on:
  schedule:
    # Roda todos os dias às 00:00 UTC (garante que não passe 7 dias)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente se quiser testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"